<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中...</title>
    <!-- 3秒后自动跳转 -->
    <meta http-equiv="refresh" content="3; url=https://space.bilibili.com/346893783140938">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.4);
        }
        .emoji-big {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1f2e;
            margin-bottom: 8px;
        }
        .sub {
            color: #5b6a7e;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f0f4fe;
            border-radius: 16px;
            padding: 14px 18px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: #1a2b4a;
            word-break: break-all;
            border: 1px dashed #8aa3d9;
            margin-bottom: 28px;
        }
        .timer {
            font-size: 18px;
            font-weight: 500;
            color: #4a6cf7;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #4a6cf7;
            color: white;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(74,108,247,0.3);
        }
        .btn:hover {
            background: #3a5de0;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74,108,247,0.35);
        }
        .footnote {
            margin-top: 20px;
            color: #8a9bb0;
            font-size: 14px;
        }
        .footnote a {
            color: #4a6cf7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="emoji-big">🚀</span>
        <h1>跳转到我的账号</h1>
        <p class="sub">即将带您前往我的 B站 个人空间</p >

        <div class="url-box">
            https://space.bilibili.com/346893783140938
        </div>

        <div class="timer" id="countdown">⏳ 3 秒后自动跳转</div>

        <a href=" " class="btn">👉 立即跳转</a >

        <p class="footnote">
            如果浏览器没有自动跳转，请点击上面的按钮。
        </p >
    </div>

    <script>
        // 倒计时效果（可选）
        let seconds = 3;
        const timerEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(interval);
                timerEl.textContent = '🚀 正在跳转...';
            } else {
                timerEl.textContent = `⏳ ${seconds} 秒后自动跳转`;
            }
        }, 1000);
    </script>
</body>
</html>
