<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Auto redirect after 2 seconds -->
    <meta http-equiv="refresh" content="2; url=https://space.bilibili.com/346893783140938">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #e9edf4;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 8px;
        }
        .sub {
            color: #5b6f82;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .link-box {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 14px 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #1a2b4a;
            word-break: break-all;
            border: 1px dashed #b8c9e0;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #4a6cf7;
            color: white;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #3458e0;
            transform: translateY(-2px);
        }
        .footnote {
            margin-top: 20px;
            color: #8a9bb0;
            font-size: 14px;
        }
        .timer {
            font-weight: 500;
            color: #4a6cf7;
            margin-bottom: 16px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Go to Bilibili</h1>
        <p class="sub">Redirecting to my Bilibili Space</p >

        <div class="link-box">
            https://space.bilibili.com/346893783140938
        </div>

        <div class="timer" id="countdown">⏳ Redirecting in 2 seconds...</div>

        <a href=" " class="btn">Click to Jump</a >

        <p class="footnote">If not redirected automatically, click the button above.</p >
    </div>

    <script>
        let seconds = 2;
        const timerEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(interval);
                timerEl.textContent = '🚀 Redirecting now...';
            } else {
                timerEl.textContent = `⏳ Redirecting in ${seconds} seconds...`;
            }
        }, 1000);
    </script>
</body>
</html>
